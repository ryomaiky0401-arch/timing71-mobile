<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timing71 Mobile Demo</title><style>body{background:#10151c;color:#eaf0f7;font-family:system-ui;margin:0;padding:18px}header{display:flex;justify-content:space-between;align-items:center}h1{color:#b8f271;font-size:23px}select,button{background:#26313f;color:white;border:1px solid #526073;border-radius:8px;padding:10px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:12px 5px;border-bottom:1px solid #344052;text-align:left}th{color:#b0becb}.note{color:#ffca78;font-size:13px;margin:15px 0}.panel{overflow-x:auto}small{color:#a6b2c0}input{background:#26313f;color:white;border:1px solid #526073;border-radius:8px;padding:10px;max-width:100%;box-sizing:border-box} .tools{margin:16px 0;display:grid;gap:9px} .status{font-size:13px;color:#a6b2c0}</style></head><body><header><h1>TIMING71 MOBILE</h1><small>DEMO</small></header><p class="note">試作画面です。以下は架空データであり、実際のライブタイミングには接続していません。</p><label>シリーズ <select id="series"><option>WEC</option><option>GTWC Europe</option><option>IMSA</option><option>Nürburgring 24h</option><option>Spa 24h</option></select></label><div class="tools"><label>JSONデータURL（HTTPS / CORS対応）<input id="feed" type="url" placeholder="https://example.org/timing.json"></label><button id="load">読み込む</button><button id="demo">デモに戻す</button><div id="status" class="status">デモデータを表示中</div></div><h2 id="heading">WEC · Demo</h2><div class="panel"><table><thead><tr><th>POS</th><th>CAR</th><th>GAP</th><th>LAST LAP</th></tr></thead><tbody id="rows"></tbody></table></div><p><small>GitHub Pages / 非公式試作版。Timing71公式とは無関係です。</small></p><script>const data=[['1','#51','LEADER','1:31.245'],['2','#7','+1.842','1:31.552'],['3','#6','+3.109','1:31.867'],['4','#83','+5.226','1:32.101']];document.querySelector('#rows').innerHTML=data.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('');document.querySelector('#series').addEventListener('change',e=>document.querySelector('#heading').textContent=e.target.value+' · Demo');const status=document.querySelector('#status');const render=items=>{const tbody=document.querySelector('#rows');tbody.replaceChildren();items.forEach((item,i)=>{const tr=document.createElement('tr');[item.position??i+1,item.car??'',item.gap??'',item.lastLap??''].forEach(v=>{const td=document.createElement('td');td.textContent=String(v);tr.append(td)});tbody.append(tr)})};document.querySelector('#load').onclick=async()=>{const url=document.querySelector('#feed').value.trim();try{const u=new URL(url);if(u.protocol!=='https:')throw Error('HTTPSのURLを入力してください');status.textContent='取得中…';const response=await fetch(u.href,{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const payload=await response.json();const rows=Array.isArray(payload)?payload:payload.cars;if(!Array.isArray(rows)||rows.length>500)throw Error('JSON形式が違います。配列または cars 配列が必要です');render(rows);status.textContent='読み込み成功（自動更新なし）';}catch(e){status.textContent='読み込み失敗: '+e.message+'。CORS制限やJSON形式も確認してください'}};document.querySelector('#demo').onclick=()=>{render(data.map(r=>({position:r[0],car:r[1],gap:r[2],lastLap:r[3]})));status.textContent='デモデータを表示中'};</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timing71 Mobile Demo</title><style>body{background:#10151c;color:#eaf0f7;font-family:system-ui;margin:0;padding:18px}header{display:flex;justify-content:space-between;align-items:center}h1{color:#b8f271;font-size:23px}select,button{background:#26313f;color:white;border:1px solid #526073;border-radius:8px;padding:10px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:12px 5px;border-bottom:1px solid #344052;text-align:left}th{color:#b0becb}.note{color:#ffca78;font-size:13px;margin:15px 0}.panel{overflow-x:auto}small{color:#a6b2c0}</style></head><body><header><h1>TIMING71 MOBILE</h1><small>DEMO</small></header><p class="note">試作画面です。以下は架空データであり、実際のライブタイミングには接続していません。</p><label>シリーズ <select id="series"><option>WEC</option><option>GTWC Europe</option><option>IMSA</option><option>Nürburgring 24h</option><option>Spa 24h</option></select></label><h2 id="heading">WEC · Demo</h2><div class="panel"><table><thead><tr><th>POS</th><th>CAR</th><th>GAP</th><th>LAST LAP</th></tr></thead><tbody id="rows"></tbody></table></div><p><small>GitHub Pages / 非公式試作版。Timing71公式とは無関係です。</small></p><script>const data=[['1','#51','LEADER','1:31.245'],['2','#7','+1.842','1:31.552'],['3','#6','+3.109','1:31.867'],['4','#83','+5.226','1:32.101']];document.querySelector('#rows').innerHTML=data.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('');document.querySelector('#series').addEventListener('change',e=>document.querySelector('#heading').textContent=e.target.value+' · Demo');</script></body></html>
